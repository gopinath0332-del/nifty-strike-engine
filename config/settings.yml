# ============================================================
# Nifty Strike Engine — Strategy & System Settings
# ============================================================

# Trade Settings
trade:
  lot_size: 65 # NIFTY current lot size (units per contract)
  max_trades_per_day: 1 # Only 1 trade per day — CE OR PE, never both

# Strategy & Database
strategy:
  name: "NIFTY_OPTIONS_BUY_V9"
  firestore_credentials_path: "config/serviceAccountKey.json"
  firestore_collection: "nifty"

# Logging Level (DEBUG, INFO, WARNING, ERROR)
logging:
  level: "INFO"

# Indicator Parameters (Pine Script defaults)
indicators:
  supertrend:
    atr_period: 10
    factor: 3.0
    buffer_points: 0.0              # Standard TradingView default (no offset)
  rsi:
    length: 14
  bollinger_bands:
    length: 20
    multiplier: 2.0

# Session Timing (IST)
timing:
  candle_interval_minutes: 5
  entry_cutoff_time: "14:45" # No new entries after 14:45 IST
  eod_exit_time: "15:00" # Hard force-close all positions at 15:00 IST
  enforce_market_hours: true # Bypass WebSocket on weekends and outside 09:14-15:30 IST
  skip_first_candle: true # Skip entry on opening candle of the day (09:15-09:20) to avoid gap traps
  warmup_candles: 250 # Number of historical candles pre-seeded on startup for indicator convergence

# Position Sizing & Scaling Recommendations
sizing:
  mode: "DYNAMIC"                # FIXED (strictly lot_size) or DYNAMIC (suggests scale-up / step-down)
  use_broker_balance: true       # In LIVE mode, fetch real-time liquid cash from Zerodha
  initial_capital: 150000        # Starting capital in INR (used in backtesting & simulation fallback)
  base_lots: 1                   # Starting lot count (1 lot = 65 units)
  max_lots: 5                    # Maximum allowable lot count
  profit_step_per_lot: 40000     # Net profit in INR needed per additional lot
  min_trades_per_scale: 40       # Minimum trade count on current tier before scaling up
  step_down_dd_pct: 12.0         # Drawdown % from peak equity to trigger step-down

